<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar</title>
    <meta name="description" content="Nexa Play">
    <link rel="icon" href="../assets/icones/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script src="../js/functions.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/motion.js" defer></script>
</head>

<body data-root="../" data-page="auth">
    <a class="back" href="../index.html" data-back aria-label="Voltar"><span aria-hidden="true">←</span></a>
    <a class="auth-logo" href="../index.html" aria-label="Nexa Play"><img src="../assets/imagens/logo-branca.svg"
            alt="Nexa Play" width="157" height="84"></a>
    <main class="auth"><span class="blob"></span>
        <div class="auth-copy">
            <h1>ENTRE NO <b>NEXA QUEST</b></h1>
        </div>
        <section class="card" aria-label="Entrar"><img class="logo-c" src="../assets/imagens/logo-escura-quest.svg"
                alt="Nexa Play" width="157" height="84">
            <form id="form-login" novalidate>
                <div class="field"><label class="sr-only" for="id_login">E-mail ou usuário</label>
                    <div class="icon-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 21c0-4 3.5-6 8-6s8 2 8 6" />
                        </svg><input class="input" id="id_login" name="id_login" placeholder="Email ou usuário"
                            autocomplete="username" required></div><span class="err" id="id_login-err"></span>
                </div>
                <div class="field"><label class="sr-only" for="senha">Senha</label>
                    <div class="icon-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="5" y="11" width="14" height="10" rx="2" />
                            <path d="M8 11V8a4 4 0 018 0v3" />
                        </svg><input class="input" id="senha" name="senha" type="password" placeholder="Senha"
                            autocomplete="current-password" required></div><span class="err" id="senha-err"></span>
                </div>
                <div class="line-row"><label><input type="checkbox" name="lembrar"> Lembrar de mim</label></div>
                <button class="btn" type="submit">ENTRAR</button>
                <p class="status" id="login-status" role="status"></p>
                <div class="or">OU</div><button class="btn btn-soft" type="button" id="google-btn"><svg width="18"
                        viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335"
                            d="M24 9.500c3.5 0 6.6 1.2 9.1 3.600l6.8-6.800C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.200l7.9 6.100C12.4 13.5 17.7 9.5 24 9.500z" />
                        <path fill="#4285F4"
                            d="M46.5 24.500c0-1.6-.1-3.1-.4-4.500H24v9h12.700c-.6 3-2.3 5.5-4.8 7.200l7.5 5.800c4.4-4.1 7.1-10.1 7.1-17.500z" />
                        <path fill="#FBBC05"
                            d="M10.5 28.700A14.5 14.5 0 019.5 24c0-1.6.3-3.2.9-4.700l-7.9-6.100A24 24 0 000 24c0 3.9.9 7.5 2.6 10.800z" />
                        <path fill="#34A853"
                            d="M24 48c6.5 0 11.9-2.1 15.9-5.800l-7.5-5.800c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4-13.5-9.800l-7.9 6.100C6.5 42.6 14.6 48 24 48z" />
                    </svg> Continuar com o Google</button>
                <a class="btn btn-soft" href="criar-conta.html">Criar conta</a>
            </form>
        </section>
    </main>
</body>

</html>
