<!DOCTYPE html>
<html class="np-loading" lang="pt-BR" data-social-theme data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="../css/preloader.css">
  <noscript><link rel="stylesheet" href="../css/preloader-off.css"></noscript>
  <link rel="preload" href="../assets/fontes/fredoka-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fontes/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="../js/theme.js"></script>
  <title>Explorar | Nexa Quest</title>
  <meta name="description" content="Descubra projetos públicos da comunidade Nexa Quest.">
  <link rel="icon" href="../assets/icones/favicon.svg">
  <script src="../js/preloader.js" defer></script>
  <script src="../js/functions.js" defer></script>
  <script src="../js/session-boot.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>

<body data-page="projetos-explorar" data-root="../" data-protected="1">
  <div class="np-preloader" id="np-preloader" role="status" aria-live="polite">
    <img class="np-preloader__mark" src="../assets/imagens/golfinho-fone.svg" alt="" width="241" height="152" decoding="async" fetchpriority="high">
    <span class="np-preloader__spinner" aria-hidden="true"></span>
    <span class="np-preloader__sr">Carregando…</span>
    <p class="np-preloader__hint" aria-hidden="true">Isso está demorando mais que o normal…</p>
  </div>
  <link rel="stylesheet" href="../css/fontes.css">
  <link rel="stylesheet" href="../css/social.css">
  <link rel="stylesheet" href="../css/theme.css">
  <a class="sr-only" href="#conteudo">Ir para o conteúdo</a>
  <header data-component="header"></header>
  <main id="conteudo">
    <div class="nq-pagehead">
      <div>
        <h1>Explorar projetos</h1>
        <p class="nq-pagehead-lead">Descubra o que a comunidade está criando e peça para participar.</p>
      </div>
      <div class="nq-pagehead-actions nq-create-mobile">
        <a class="btn btn-sm" href="criar-projeto.html">Criar projeto</a>
      </div>
    </div>
    <form id="project-search-form" class="projects-filters" role="search">
      <label class="sr-only" for="project-search">Buscar projetos</label>
      <input id="project-search" name="q" type="search" maxlength="100" placeholder="Buscar por título ou descrição">
      <input id="project-category" name="categoria" type="hidden" value="">
      <button class="btn-soft btn" type="submit">Buscar</button>
      <button class="btn-soft" id="project-search-clear" type="button">Limpar busca</button>
    </form>
    <div role="group" aria-label="Filtrar por categoria" id="project-chips">
      <div class="chips"><button type="button" class="chip" data-cat="" aria-pressed="true">Todos</button>
        <button type="button" class="chip" data-cat="Desenvolvimento de Sistemas" aria-pressed="false">Desenvolvimento de Sistemas</button>
        <button type="button" class="chip" data-cat="Design" aria-pressed="false">Design</button>
        <button type="button" class="chip" data-cat="Multimídia" aria-pressed="false">Multimídia</button>
        <button type="button" class="chip" data-cat="Jogos Digitais" aria-pressed="false">Jogos Digitais</button>
      </div>
      <details class="legacy-categories" id="legacy-project-categories"><summary>Categorias anteriores</summary>
        <div class="chips"><button type="button" class="chip" data-cat="Jogos" aria-pressed="false">Jogos</button><button type="button" class="chip" data-cat="Arte e design" aria-pressed="false">Arte e design</button><button type="button" class="chip" data-cat="Programação" aria-pressed="false">Programação</button><button type="button" class="chip" data-cat="Educação" aria-pressed="false">Educação</button><button type="button" class="chip" data-cat="Música" aria-pressed="false">Música</button><button type="button" class="chip" data-cat="Outros" aria-pressed="false">Outros</button></div>
      </details>
    </div>
    <p id="projects-status" class="feed-status" role="status" aria-live="polite"></p>
    <section class="project-grid" id="project-list" aria-label="Projetos públicos" aria-live="polite" aria-busy="true">
    </section>
    <button id="projects-load-more" class="feed-load-more" type="button" hidden>Carregar mais projetos</button>
  </main>
</body>

</html>
