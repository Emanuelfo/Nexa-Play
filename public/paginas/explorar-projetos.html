<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar projetos | Nexa Quest</title>
  <meta name="description" content="Descubra criações públicas da comunidade Nexa Quest.">
  <link rel="icon" href="../assets/icones/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/area-logada.css">
  <link rel="stylesheet" href="../css/social-v2.css">
  <script src="../js/functions.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/social-v2.js" defer></script>
</head>

<body data-page="projetos-explorar" data-root="../" data-protected="1">
  <a class="sr-only" href="#conteudo">Ir para o conteúdo</a>
  <header data-component="header"></header>
  <main id="conteudo" class="projects-page">
    <header class="projects-hero">
      <div>
        <p class="feed-eyebrow">IDEIAS EM MOVIMENTO</p>
        <h1>Projetos da comunidade</h1>
        <p>Descubra criações públicas, conheça quem está por trás delas e encontre sua próxima colaboração.</p>
      </div>
      <div class="projects-hero-actions">
        <a class="btn btn-line" href="meus-projetos.html">Meus projetos</a>
        <a class="btn" href="criar-projeto.html">Criar projeto</a>
      </div>
    </header>
    <form id="project-search-form" class="projects-filters" role="search">
      <label class="projects-search-field">Buscar projetos
        <input id="project-search" name="q" type="search" maxlength="100" placeholder="Título ou descrição">
      </label>
      <label>Categoria
        <select id="project-category" name="categoria">
          <option value="">Todas as categorias</option>
          <option>Jogos</option>
          <option>Arte e design</option>
          <option>Programação</option>
          <option>Educação</option>
          <option>Música</option>
          <option>Outros</option>
        </select>
      </label>
      <button class="btn btn-soft" type="submit">Buscar</button>
    </form>
    <p id="projects-status" class="feed-status" role="status" aria-live="polite"></p>
    <section class="project-grid" id="project-list" aria-label="Projetos públicos" aria-live="polite" aria-busy="true">
      <p class="feed-loading">Carregando projetos…</p>
    </section>
    <button id="projects-load-more" class="feed-load-more" type="button" hidden>Carregar mais projetos</button>
  </main>
  <footer data-component="footer"></footer>
</body>

</html>
