<!DOCTYPE html>
<html class="np-loading" lang="pt-BR" data-social-theme data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="../css/preloader.css">
  <noscript><link rel="stylesheet" href="../css/preloader-off.css"></noscript>
  <link rel="preload" href="../assets/fontes/fredoka-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fontes/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="../js/theme.js"></script>
  <title>Criar projeto | Nexa Quest</title>
  <meta name="description" content="Publique um projeto na comunidade Nexa Quest.">
  <link rel="icon" href="../assets/icones/favicon.svg">
  <script src="../js/preloader.js" defer></script>
  <script src="../js/functions.js" defer></script>
  <script src="../js/session-boot.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>

<body data-page="projeto-criar" data-root="../" data-protected="1">
  <div class="np-preloader" id="np-preloader" role="status" aria-live="polite">
    <img class="np-preloader__mark" src="../assets/imagens/golfinho-fone.svg" alt="" width="241" height="152" decoding="async" fetchpriority="high">
    <span class="np-preloader__spinner" aria-hidden="true"></span>
    <span class="np-preloader__sr">Carregando…</span>
    <p class="np-preloader__hint" aria-hidden="true">Isso está demorando mais que o normal…</p>
  </div>
  <link rel="stylesheet" href="../css/fontes.css">
  <link rel="stylesheet" href="../css/social.css">
  <link rel="stylesheet" href="../css/theme.css">
  <a class="sr-only" href="#conteudo">Ir para o conteúdo</a>
  <header data-component="header"></header>
  <main id="conteudo">
    <div class="nq-pagehead">
      <div>
        <h1>Criar projeto</h1>
        <p class="nq-pagehead-lead">Conte sobre sua ideia e escolha como as pessoas podem participar.</p>
      </div>
    </div>
    <section class="project-form-card" aria-labelledby="create-project-title">
      <h2 id="create-project-title" class="sr-only">Informações do projeto</h2>
      <form id="project-form" class="project-form">
        <fieldset class="form-group">
          <legend>Sobre o projeto</legend>
          <label>Título
            <input name="titulo" type="text" maxlength="120" required placeholder="Um nome para sua ideia">
          </label>
          <label>Descrição
            <textarea name="descricao" rows="6" maxlength="5000" required
              placeholder="O que o projeto faz? Como as pessoas podem participar?"></textarea>
            <small>Até 5.000 caracteres.</small>
          </label>
        </fieldset>
        <fieldset class="form-group">
          <legend>Organização</legend>
          <div class="project-form-row project-form-row--3">
            <label>Categoria
              <select name="categoria" required>
                <option value="">Selecione</option>
                <option>Jogos</option>
                <option>Arte e design</option>
                <option>Programação</option>
                <option>Educação</option>
                <option>Música</option>
                <option>Outros</option>
              </select>
            </label>
            <label>Formato
              <select name="tipo" required>
                <option value="individual">Individual</option>
                <option value="equipe">Em equipe</option>
              </select>
            </label>
            <label>Visibilidade
              <select name="visibilidade" required>
                <option value="publico">Público: aparece em Explorar</option>
                <option value="privado">Privado: só a equipe</option>
              </select>
            </label>
          </div>
        </fieldset>
        <fieldset class="form-group">
          <legend>Divulgação <span class="form-optional">opcional</span></legend>
          <div class="project-form-row">
            <label>Imagem de capa (URL HTTPS)
              <input name="imagem_url" type="url" inputmode="url" placeholder="https://…" autocomplete="url">
            </label>
            <label>Link externo (URL HTTPS)
              <input name="link_externo" type="url" inputmode="url" placeholder="Site, repositório ou demonstração">
            </label>
          </div>
        </fieldset>
        <p id="project-form-status" class="feed-status" role="status" aria-live="polite"></p>
        <div class="project-form-actions">
          <a class="btn-soft" href="explorar-projetos.html">Cancelar</a>
          <button class="btn" type="submit">Publicar projeto</button>
        </div>
      </form>
    </section>
  </main>
</body>

</html>
