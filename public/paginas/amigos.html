<!DOCTYPE html>
<html lang="pt-BR" data-social-theme data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="../js/theme.js"></script>
  <title>Pessoas | Nexa Quest</title>
  <meta name="description" content="Encontre jogadores e gerencie suas amizades no Nexa Quest.">
  <link rel="icon" href="../assets/icones/favicon.svg">
  <link rel="stylesheet" href="../css/social.css">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/functions.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>

<body data-page="amigos" data-root="../" data-protected="1">
  <a class="sr-only" href="#conteudo">Ir para o conteúdo</a>
  <header data-component="header"></header>
  <main id="conteudo">
    <div class="nq-pagehead">
      <h1>Pessoas</h1>
    </div>
    <p id="friends-page-status" class="feed-status" role="status" aria-live="polite" style="margin:0 .75rem .75rem"></p>
    <form id="friends-search-form" class="friends-search" role="search">
      <label class="sr-only" for="friends-search-input">Buscar por nome ou nome de usuário</label>
      <input id="friends-search-input" type="search" minlength="2" maxlength="100"
        placeholder="Buscar por nome ou @usuário" autocomplete="off" required>
      <button class="btn" type="submit">Buscar</button>
    </form>
    <section class="friends-block" id="friends-search-block" hidden>
      <h2>Resultados da busca</h2>
      <p id="friends-search-status" class="friends-status" role="status" aria-live="polite"></p>
      <div id="friend-search-results" class="friends-list" aria-live="polite" hidden></div>
    </section>

    <div class="nq-tabs" role="tablist" aria-label="Sua rede" id="friends-tabs" style="margin-bottom:1rem">
      <button type="button" role="tab" aria-selected="true" data-tab="friend-suggestions-panel">Sugestões</button>
      <button type="button" role="tab" aria-selected="false" data-tab="friends-list">Amigos <span class="count"
          id="friends-count" aria-label="Quantidade de amigos">—</span></button>
      <button type="button" role="tab" aria-selected="false" data-tab="friend-requests-received">Recebidas <span
          class="count" id="friend-requests-received-count">0</span></button>
      <button type="button" role="tab" aria-selected="false" data-tab="friend-requests-sent">Enviadas <span
          class="count" id="friend-requests-sent-count">0</span></button>
    </div>

    <section class="pf-panel is-active" id="friend-suggestions-panel" role="tabpanel">
      <p id="friend-suggestions-status" class="friends-status" role="status" aria-live="polite">Carregando sugestões…
      </p>
      <div id="friend-suggestions" class="friends-list" aria-live="polite" aria-busy="true"></div>
    </section>
    <section class="pf-panel" id="friends-list" role="tabpanel">
      <p id="friends-list-status" class="friends-status" role="status" aria-live="polite">Carregando seus amigos…</p>
      <div id="friends-list-content" class="friends-list" aria-live="polite" aria-busy="true"></div>
    </section>
    <section class="pf-panel" id="friend-requests-received" role="tabpanel">
      <p id="friend-requests-received-status" class="friends-status" role="status" aria-live="polite">Carregando
        solicitações…</p>
      <div id="friend-requests-received-list" class="friends-list" aria-live="polite" aria-busy="true"></div>
    </section>
    <section class="pf-panel" id="friend-requests-sent" role="tabpanel">
      <p id="friend-requests-sent-status" class="friends-status" role="status" aria-live="polite">Carregando
        solicitações…</p>
      <div id="friend-requests-sent-list" class="friends-list" aria-live="polite" aria-busy="true"></div>
    </section>
  </main>
</body>

</html>
