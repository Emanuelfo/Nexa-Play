<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta</title>
    <meta name="description" content="Nexa Play">
    <link rel="icon" href="../assets/icones/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script src="../js/functions.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/motion.js" defer></script>
</head>

<body data-root="../" data-page="auth">
    <a class="back" href="../index.html" data-back aria-label="Voltar"><span aria-hidden="true">←</span></a>
    <a class="auth-logo" href="../index.html" aria-label="Nexa Play"><img src="../assets/imagens/logo-branca.svg"
            alt="Nexa Play" width="157" height="84"></a>
    <main class="auth"><span class="blob"></span>
        <div class="auth-copy">
            <h1>CRIE UMA <b>CONTA</b></h1>
        </div>
        <section class="card" aria-label="Cadastro">
            <form id="form-cadastro" novalidate>
                <div class="avatar"><img id="avatar-img"
                        src="../assets/imagens/logo-escura-quest.svg">
                    
                </div>
                <div class="field"><label class="sr-only" for="nome_usuario">Nome de Usuário</label><input class="input"
                            id="nome_usuario" name="nome_usuario" type="text" placeholder="Nome de Usuário"
                            autocomplete="username" required maxlength="100"><span class="err" id="nome_usuario-err"></span></div>
                <div class="field"><label class="sr-only" for="email">E-mail</label><input class="input"
                        id="email" name="email" type="email" placeholder="E-mail" autocomplete="email"
                        required><span class="err" id="email-err"></span></div>
                <div class="field"><label class="sr-only" for="senha">Senha</label><input class="input" id="senha"
                        name="senha" type="password" placeholder="Senha" autocomplete="new-password" required
                        minlength="6"><span class="err" id="senha-err"></span></div>
                <div class="field"><label class="sr-only" for="confirmar-senha">Confirmar Senha</label><input class="input" id="confirmar-senha"
                        name="confirmar-senha" type="password" placeholder="Confirmar Senha" autocomplete="new-password" required
                        minlength="6"><span class="err" id="confirmar-senha-err"></span></div>
                <button class="btn" type="submit">Cadastrar</button>
                <p class="status" id="cadastro-status" role="status"></p>
                <div class="or">OU</div>
                <p id="ja-tem-conta" style="text-align:center;font-size:.75rem">Já tem conta?</p>
                <a class="btn btn-soft" href="login.html">Entrar</a>
            </form>
        </section>
    </main>
</body>

</html>
