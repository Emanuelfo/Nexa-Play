<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Perfil | Nexa Quest</title>
  <meta name="description" content="Perfil de um jogador da comunidade Nexa Quest.">
  <link rel="icon" href="../assets/icones/favicon.svg">
  <link rel="stylesheet" href="../css/social.css">
  <script src="../js/functions.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>

<body data-page="perfil-publico" data-root="../" data-protected="1">
  <a class="sr-only" href="#conteudo">Ir para o conteúdo</a>
  <header data-component="header"></header>
  <main id="conteudo">
    <h1 class="sr-only">Perfil</h1>
    <p id="public-profile-status" class="feed-status" role="status" aria-live="polite"></p>
    <section id="public-profile" class="pf-head" aria-labelledby="profile-name" aria-busy="true">
      <div class="player-cover" data-profile-cover><img data-cover-image alt="" hidden></div>
      <div class="pf-body">
        <div class="pf-top">
          <div class="player-avatar" data-profile-avatar aria-hidden="true"><span data-avatar-initial>?</span><img data-avatar-image alt="" hidden></div>
          <div class="player-profile-actions">
            <div data-relationship-actions hidden></div>
          </div>
        </div>
        <div class="player-identity">
          <h2 id="profile-name" data-profile-name>Carregando perfil…</h2>
          <p class="player-handle" data-profile-handle></p>
          <p class="player-bio" data-profile-bio></p>
          <p class="player-private-notice" data-profile-private hidden>Este jogador limitou as informações do perfil a amigos. Envie uma solicitação de amizade para ver conquistas, projetos e publicações.</p>
        </div>
        <div class="player-stats" data-profile-stats aria-label="Resumo do jogador"></div>
        <p class="player-joined" data-profile-joined></p>
        <div class="pf-journey" data-profile-journey hidden></div>
      </div>
    </section>

    <div class="nq-tabs pf-tabs" role="tablist" aria-label="Seções do perfil" id="profile-tabs">
      <button type="button" role="tab" id="tab-publicacoes" aria-controls="publicacoes" aria-selected="true" data-tab="publicacoes">Publicações</button>
      <button type="button" role="tab" id="tab-projetos" aria-controls="projetos" aria-selected="false" data-tab="projetos">Projetos</button>
      <button type="button" role="tab" id="tab-conquistas" aria-controls="conquistas" aria-selected="false" data-tab="conquistas">Conquistas</button>
      <button type="button" role="tab" id="tab-jornada" aria-controls="jornada" aria-selected="false" data-tab="jornada">Atividade</button>
    </div>
    <div class="pf-panels">
      <section class="pf-panel is-active" id="publicacoes" role="tabpanel" aria-labelledby="tab-publicacoes">
        <div id="feed-list" class="feed-list" aria-live="polite" aria-busy="true">
          <div class="feed-loading" role="status"><div class="skeleton-row"><i></i><i></i></div></div>
        </div>
        <p id="feed-status" class="feed-status" role="status" aria-live="polite"></p>
        <button id="feed-load-more" class="feed-load-more" type="button" hidden>Carregar mais publicações</button>
      </section>

      <section class="pf-panel" id="projetos" role="tabpanel" aria-labelledby="tab-projetos">
        <div class="nq-panel-head"><h2>Projetos publicados</h2></div>
        <p data-profile-projects-status class="feed-status" role="status" aria-live="polite"></p>
        <div class="project-grid" data-profile-projects aria-live="polite" aria-busy="true"></div>
        <a class="profile-text-button" data-profile-projects-link href="explorar-projetos.html">Ver todos os projetos</a>
      </section>

      <section class="pf-panel" id="conquistas" role="tabpanel" aria-labelledby="tab-conquistas">
        <div class="nq-panel-head"><h2>Conquistas</h2><strong class="profile-section-count" data-achievement-count></strong></div>
        <div class="profile-achievements" data-profile-achievements aria-live="polite"></div>
      </section>

      <section class="pf-panel" id="jornada" role="tabpanel" aria-labelledby="tab-jornada">
        <div class="nq-panel-head"><h2>Atividade no Nexa Quest</h2><a class="btn-soft btn-sm" data-profile-game-link href="estatisticas.html">Ver detalhes</a></div>
        <div data-profile-progress aria-live="polite"></div>
      </section>
    </div>
  </main>
</body>

</html>
