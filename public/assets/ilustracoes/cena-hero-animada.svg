<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" width="600" height="580" role="img" aria-label="Cenário com sol, nuvens, terraços, um monitor de código, um controle e uma janela de rede social"><style>
@media (prefers-reduced-motion: no-preference) {
  .nq-cloud { animation: nq-drift 50s ease-in-out infinite alternate; }
  .nq-cloud-1 { animation-duration: 56s; }
  .nq-cloud-2 { animation-duration: 44s; animation-delay: -18s; }
  .nq-cloud-3 { animation-duration: 60s; animation-delay: -31s; }
  .nq-spark { transform-box: fill-box; transform-origin: center; animation: nq-twinkle 3.6s ease-in-out infinite; }
  .nq-spark-2 { animation-duration: 3s; animation-delay: -1.2s; }
  .nq-spark-3 { animation-duration: 4s; animation-delay: -2.4s; }
}
@keyframes nq-drift { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
@keyframes nq-twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.7); } }
